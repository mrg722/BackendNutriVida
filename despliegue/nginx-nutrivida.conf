# Configuración de Nginx para publicar el proyecto en una instancia EC2.
# La instalo en /etc/nginx/sites-available/nutrivida y la enlazo a sites-enabled.
#
# Nginx es el único punto HTTP público: escucha en el 80 y reparte. Los puertos 8081 y 8082
# quedan cerrados en el grupo de seguridad de AWS y solo escuchan en 127.0.0.1.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Aquí dejo el resultado de "npm run build" del frontend React.
    root /var/www/nutrivida;
    index index.html;

    # Primer destino: el microservicio de autenticación.
    # La barra final en location y en proxy_pass es la que hace la sustitución del prefijo:
    # /api/auth-service/v1/auth/login llega a 127.0.0.1:8081/api/v1/auth/login
    location /api/auth-service/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Segundo destino: el microservicio de citas, catálogo y fichas clínicas.
    # /api/citas-service/v1/citas/mias llega a 127.0.0.1:8082/api/v1/citas/mias
    location /api/citas-service/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás lo atiende React. try_files es lo que permite recargar una ruta interna
    # como /mis-citas sin recibir un 404: si el archivo no existe, devuelvo index.html
    # y el enrutador de React resuelve la vista.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
