# Perfil de producción que activo con SPRING_PROFILES_ACTIVE=prod, como indica la Guía 18.

# Escucho solo en la interfaz local: a Internet llega únicamente Nginx en el puerto 80.
server.address=127.0.0.1
server.port=8081

# En producción ninguna credencial tiene valor por defecto: todas vienen del EnvironmentFile.
spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Apago el log de SQL porque en producción solo agrega ruido.
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.issuer=nutrivida-auth

# El origen autorizado deja de ser localhost y pasa a ser la dirección pública del frontend.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}
