# Nombre con el que este microservicio se identifica en los logs
spring.application.name=nutrivida-auth

# Escucho en 8081 para no chocar con nutrivida-citas, que usa 8082
server.port=8081

# Este microservicio es dueño de su propia base y se conecta con su propia cuenta de MySQL,
# distinta de la del servicio de citas. La cuenta nutrivida_auth_app solo tiene permisos sobre
# nutrivida_auth: si intentara leer una tabla del otro servicio, MySQL se lo niega.
#
# El usuario y la clave no tienen valor por defecto a propósito. Antes caían en root sin
# contraseña, y eso significaba que los dos microservicios entraban con la misma llave maestra:
# las bases estaban separadas de nombre, pero no de permisos. Ahora, si falta la variable, el
# servicio no arranca y el problema se nota al tiro.
spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/nutrivida_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASSWORD}

# Dejo que JPA cree y actualice la tabla usuarios mientras desarrollo
spring.jpa.hibernate.ddl-auto=update
# Cierro la sesion JPA antes de la capa web para no arrastrar entidades abiertas
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Clave con la que firmo el token. A propósito no le dejo un valor por defecto: si la variable
# JWT_SECRET no está definida, el servicio no arranca. Prefiero que falle al iniciar y se note,
# antes que arrancar en silencio con una clave conocida que cualquiera podría leer en el
# repositorio y usar para fabricar tokens válidos. En nutrivida-citas tiene que valer lo mismo.
app.jwt.secret=${JWT_SECRET}
# El token vive una hora; pasado ese tiempo el usuario debe volver a iniciar sesion
app.jwt.expiration-ms=3600000
app.jwt.issuer=nutrivida-auth

# Origen del frontend Vite autorizado por CORS
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
