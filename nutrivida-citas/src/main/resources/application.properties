# Nombre con el que este microservicio se identifica en los logs
spring.application.name=nutrivida-citas

# Escucho en 8082: nutrivida-auth ocupa el 8081 y son dos procesos independientes
server.port=8082

# Base de datos propia: este microservicio no toca las tablas del servicio de autenticación, y
# ahora tampoco podría aunque quisiera. Se conecta con la cuenta nutrivida_citas_app, que tiene
# permisos solo sobre nutrivida_citas; si pidiera la tabla usuarios, MySQL le responde que no.
#
# Igual que la clave de firma, el usuario y la contraseña no tienen valor por defecto. Antes
# caían en root sin contraseña y los dos servicios compartían la misma llave, así que la
# separación era solo de nombre. Sin la variable, este servicio no arranca.
spring.datasource.url=${CITAS_DB_URL:jdbc:mysql://localhost:3306/nutrivida_citas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${CITAS_DB_USER}
spring.datasource.password=${CITAS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Esta clave tiene que valer exactamente lo mismo que en nutrivida-auth, porque es con ella que
# verifico la firma de los tokens que ese servicio emite. Tampoco le dejo valor por defecto: sin
# la variable JWT_SECRET el servicio no arranca, y así nunca queda funcionando con una clave
# publicada en el repositorio.
app.jwt.secret=${JWT_SECRET}
# Exijo este emisor para rechazar tokens firmados por cualquier otra aplicación
app.jwt.issuer=nutrivida-auth

# Origen del frontend Vite autorizado por CORS
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
