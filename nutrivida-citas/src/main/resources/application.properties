# Nombre con el que este microservicio se identifica en los logs
spring.application.name=nutrivida-citas

# Escucho en 8082: nutrivida-auth ocupa el 8081 y son dos procesos independientes
server.port=8082

# Base de datos propia: este microservicio no toca las tablas del servicio de autenticación
spring.datasource.url=${CITAS_DB_URL:jdbc:mysql://localhost:3306/nutrivida_citas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${CITAS_DB_USER:root}
spring.datasource.password=${CITAS_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Esta clave debe valer exactamente lo mismo que en nutrivida-auth para poder verificar la firma
app.jwt.secret=${JWT_SECRET:bnV0cml2aWRhLWRlc2Fycm9sbG8tY2xhdmUtbG9jYWwtc29sby1wYXJhLXBydWViYXM=}
# Exijo este emisor para rechazar tokens firmados por cualquier otra aplicación
app.jwt.issuer=nutrivida-auth

# Origen del frontend Vite autorizado por CORS
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
